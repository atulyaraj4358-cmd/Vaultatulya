<!doctype html>
<html lang="en" data-theme="aurora">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A Vault 🔒</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c5cff">
</head>
<body>
<div class="orbs" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div id="prog"></div>
<nav class="glass">
  <b id="logo">🔒 A Vault</b>
  <span id="dot" class="dot sync" title="Sync status"></span>
  <span id="pill" hidden>Offline</span>
  <span id="themes" aria-label="Themes"></span>
  <span id="who"></span>
  <button id="loginBtn" class="btn sm">Log in</button>
</nav>
<header class="hero">
  <span class="badge">✨ Premium vault</span>
  <h1 id="title" aria-label="Everything you love. One Vault."></h1>
  <p class="tag">Your premium file &amp; app vault 🔒 &nbsp;<b id="word">APK</b></p>
  <a class="btn" href="#grid">Browse the vault ⬇️</a> <button class="btn ghost" id="gamesBtn">🎮 Games</button>
</header>
<main>
  <input id="search" type="search" placeholder="🔍 Search files, apps, tags" aria-label="Search">
  <div id="tabs" class="glass" role="tablist"></div>
  <div id="admin" hidden><button id="addBtn" class="btn sm">+ Add File</button> <button id="addApp" class="btn sm">+ Add App</button></div>
  <section id="grid"></section>
</main>
<div id="toasts" aria-live="polite"></div>
<div id="modal" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
  <!-- Naya Virtual Phone Button -->
<button id="newPhoneBtn" class="btn" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; background: #ff006e; color: white; font-weight: bold; border: none; padding: 12px 20px; border-radius: 30px; box-shadow: 0 4px 15px rgba(255,0,110,0.4);">📱 Open Phone</button>
<!-- Naya Virtual Phone Modal -->
<div id="newPhoneModal" style="display: none; position: fixed; inset: 0; z-index: 10000; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); flex-direction: column;">
  <div style="padding: 15px; display: flex; justify-content: space-between; align-items: center; background: #111; border-bottom: 1px solid #333;">
    <b style="color: white; font-family: sans-serif; font-size: 16px;">📱 My Virtual Phone</b>
    <button id="closeNewPhone" style="background: #ff3b30; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer;">✖ Close</button>
  </div>
  <!-- Tera naya phone (Myvirtaual) yahan load hoga -->
  <iframe src="https://atulyaraj4358-cmd.github.io/Myvirtaual/" style="flex: 1; width: 100%; border: none; background: #000;"></iframe>
</div>
</body>
</html>
