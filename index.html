<!doctype html>
<html lang="en" data-theme="aurora" data-ui="spatial">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A Vault 🔒</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c5cff">
</head>
<body>
<div class="orbs" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div id="prog"></div>
<nav class="glass">
  <b id="logo">🔒 A Vault</b>
  <span id="dot" class="dot sync" title="Sync status"></span>
  <span id="pill" hidden>Offline</span>
  <span id="themes" aria-label="Themes"></span>
  <span id="who"></span>
  <button id="loginBtn" class="btn sm">Log in</button>
</nav>
<header class="hero">
  <span class="badge">✨ Premium vault</span>
  <h1 id="title" aria-label="Everything you love. One Vault."></h1>
  <p class="tag">Your premium file &amp; app vault 🔒 &nbsp;<b id="word">APK</b></p>
  <a class="btn" href="#grid">Browse the vault ⬇️</a>
</header>
<main>
  <input id="search" type="search" placeholder="🔍 Search files, apps, tags" aria-label="Search">
  <div id="tabs" class="glass" role="tablist"></div>
  <div id="admin" hidden><button id="addBtn" class="btn sm">+ Add File</button> <button id="addApp" class="btn sm">+ Add App</button></div>
  <section id="grid"></section>
</main>
<div id="toasts" aria-live="polite"></div>
<div id="modal" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

<!-- Virtual Phone Modal -->
<div id="newPhoneModal" style="display: none; position: fixed; inset: 0; z-index: 10000; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); flex-direction: column;">
  <div style="padding: 15px; display: flex; justify-content: space-between; align-items: center; background: #111; border-bottom: 1px solid #333;">
    <b style="color: white; font-family: sans-serif; font-size: 16px;">📱 My Virtual Phone</b>
    <button onclick="document.getElementById('newPhoneModal').style.display = 'none';" style="background: #ff3b30; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer;">✖ Close</button>
  </div>
  <iframe src="https://atulyaraj4358-cmd.github.io/Myvirtaual/" style="flex: 1; width: 100%; border: none; background: #000;"></iframe>
</div>

<!-- Chat Modal -->
<div id="chatModal" style="display: none; position: fixed; inset: 0; z-index: 10000; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); flex-direction: column;">
  <div style="padding: 15px; display: flex; justify-content: space-between; align-items: center; background: #111; border-bottom: 1px solid #333;">
    <b style="color: white; font-family: sans-serif; font-size: 16px;">💬 Atulya's Chat</b>
    <button onclick="document.getElementById('chatModal').style.display = 'none';" style="background: #ff3b30; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer;">✖ Close</button>
  </div>
  <iframe src="https://atulyaraj4358-cmd.github.io/atulya-s_chat/" style="flex: 1; width: 100%; border: none; background: #000;"></iframe>
</div>

<!-- Writer Modal -->
<div id="writerModal" style="display: none; position: fixed; inset: 0; z-index: 10000; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); flex-direction: column;">
  <div style="padding: 15px; display: flex; justify-content: space-between; align-items: center; background: #111; border-bottom: 1px solid #333;">
    <b style="color: white; font-family: sans-serif; font-size: 16px;">✍️ Writer</b>
    <button onclick="document.getElementById('writerModal').style.display = 'none';" style="background: #ff3b30; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer;">✖ Close</button>
  </div>
  <iframe src="https://atulyaraj4358-cmd.github.io/Writer/" style="flex: 1; width: 100%; border: none; background: #000;"></iframe>
</div>

<!-- FAB Menu -->
<style>
.fab-wrap{position:fixed;right:20px;bottom:20px;z-index:9999;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.fab-menu{display:flex;flex-direction:column;align-items:flex-end;gap:12px;pointer-events:none}
.fab-menu .fab-item{opacity:0;transform:translateY(20px) scale(.5);transition:opacity .25s ease,transform .35s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
.fab-wrap.open .fab-menu{pointer-events:auto}
.fab-wrap.open .fab-menu .fab-item{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.fab-wrap.open .fab-menu .fab-item:nth-child(1){transition-delay:.15s}
.fab-wrap.open .fab-menu .fab-item:nth-child(2){transition-delay:.1s}
.fab-wrap.open .fab-menu .fab-item:nth-child(3){transition-delay:.05s}
.fab-item{border:none;color:#fff;font-weight:bold;padding:12px 20px;border-radius:30px;cursor:pointer;font-size:15px;white-space:nowrap}
.fab-toggle{width:56px;height:56px;border-radius:50%;border:none;background:#111;color:#fff;font-size:24px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.5);display:grid;place-items:center;transition:transform .3s cubic-bezier(.34,1.56,.64,1),background .2s}
.fab-toggle:active{transform:scale(.9)}
.fab-wrap.open .fab-toggle{transform:rotate(135deg);background:#ff3b30}
</style>

<div class="fab-wrap" id="fabWrap">
  <div class="fab-menu">
    <button class="fab-item" style="background:#8b5cf6;box-shadow:0 4px 15px rgba(139,92,246,.4);" onclick="openFab('writerModal')">✍️ Writer</button>
    <button class="fab-item" style="background:#ff006e;box-shadow:0 4px 15px rgba(255,0,110,.4);" onclick="openFab('newPhoneModal')">📱 Virtual Phone</button>
    <button class="fab-item" style="background:#007aff;box-shadow:0 4px 15px rgba(0,122,255,.4);" onclick="openFab('chatModal')">💬 Chat</button>
  </div>
  <button class="fab-toggle" id="fabToggle" aria-label="Menu">⋯</button>
</div>

<script>
(function(){
  var fabWrap = document.getElementById('fabWrap');
  document.getElementById('fabToggle').onclick = function(){ fabWrap.classList.toggle('open'); };
  document.addEventListener('click', function(e){
    if (!fabWrap.contains(e.target)) fabWrap.classList.remove('open');
  });
  window.openFab = function(id){
    document.getElementById(id).style.display = 'flex';
    fabWrap.classList.remove('open');
  };
})();
</script>
</body>
</html>
