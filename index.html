<!doctype html><html lang="en" data-theme="cream"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atulya's Inkwell</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#17120d">
<link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><link rel="stylesheet" href="styles.css"></head><body>
<header id="top"><button id="boxB" class="pill"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13l3-8h12l3 8v6H3z M3 13h5l1 3h6l1-3h5"/></svg>Box</button>
<div class="logo"><svg viewBox="0 0 48 48"><rect x="13" y="3" width="22" height="16" rx="2" fill="#efe6d2"/><rect x="5" y="18" width="38" height="17" rx="4" fill="#cfc8bd" stroke="#1d1a16" stroke-width="2"/><g fill="#1d1a16"><circle cx="13" cy="25" r="1.6"/><circle cx="19" cy="25" r="1.6"/><circle cx="25" cy="25" r="1.6"/><circle cx="31" cy="25" r="1.6"/><circle cx="37" cy="25" r="1.6"/><circle cx="16" cy="30" r="1.6"/><circle cx="22" cy="30" r="1.6"/><circle cx="28" cy="30" r="1.6"/><circle cx="34" cy="30" r="1.6"/></g><rect x="9" y="35" width="30" height="6" rx="2" fill="#4a463f"/></svg><span>Atulya's Inkwell</span></div>
<div class="tr"><div><button id="shareB" class="pill" aria-label="Share as image"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3m0 0L8 7m4-4l4 4M5 11v9h14v-9"/></svg></button><button id="studioB" class="pill"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Studio</button></div><div class="cnt" id="cnt"></div><div class="cnt" id="sv">Saved ✓</div></div></header>
<main id="desk"><div class="sheet"><div id="page" aria-hidden="true"></div>
<textarea id="ta" maxlength="10000" spellcheck="false" autofocus aria-label="Write here"></textarea></div></main>
<div id="dim"></div><div id="lamp"><div id="rail"></div><u id="tee"></u><i id="pod" aria-label="Lamp: tap for light level, hold to switch off"><b></b><b></b><b></b></i></div>
<div id="panel" hidden>
<label>Paper<select id="paper"><option value="letter">Letter paper</option><option value="bill">Bill / receipt</option></select></label>
<label>Theme<select id="theme"><option value="cream">Cream paper</option><option value="slate">Dark slate</option><option value="garden">Garden</option><option value="blueprint">Blueprint</option><option value="vintage">Vintage</option></select></label>
<label>Ribbon ink<select id="ink"><option value="">Theme default</option><option value="#111">Black</option><option value="#1d3f9c">Blue</option><option value="#a31d1d">Red</option><option value="#5a3a1c">Sepia</option></select></label>
<label>Font size<input id="font" type="range" min="14" max="30"></label>
<label class="r">Sound<input id="sound" type="checkbox"></label>
<label>Sound type<select id="profile"><option value="classic">Classic</option><option value="soft">Soft</option><option value="clicky">Clicky</option></select></label>
<label>Volume<input id="vol" type="range" min="0" max="1" step=".05"></label>
<label class="r">Vibration<input id="haptic" type="checkbox"></label>
<label class="r">Lamp<input id="lampOn" type="checkbox"></label>
<label>Warmth<input id="warm" type="range" min="2200" max="6500" step="100"></label>
<label>Light<input id="int" type="range" min=".2" max="1" step=".05"></label>
<label>Reach<input id="size" type="range" min="60" max="200" step="5"></label>
<label>Spread<input id="spread" type="range" min="40" max="160" step="5"></label>
<div class="btns"><button id="save">Save</button><button id="billT">Bill template</button><button id="spark">Spark a line</button><button id="notesB">Notes</button><button id="copy">Copy</button><button id="txt">.txt</button><button id="png">Image</button><button id="story">Story</button>
<button data-p="A4">Print A4</button><button data-p="Letter">Print Letter</button><button data-p="A5">Print A5</button><button id="bak">Backup</button><button id="imp">Import</button></div></div>
<aside id="notes" hidden><div class="nh"><input id="q" placeholder="Search notes" aria-label="Search notes"><button id="nn">New</button><button id="nx" aria-label="Close">×</button></div><ul id="nl"></ul></aside>
<div id="toast" hidden></div><input id="file" type="file" accept=".txt,.json" hidden>
<script src="sound.js"></script><script src="app.js"></script></body></html>
